# ===================================================
# TRENDMARK PLATFORM - NETLIFY DEPLOYMENT CONFIG
# ===================================================

[build]
  # Publish directory containing clean static assets
  publish = "dist"
  
  # Build command to sync latest assets to dist
  command = "node build.js"

[build.environment]
  # Specify modern Node.js runtime and bypass Next.js server build plugin
  NODE_VERSION = "20"
  NETLIFY_NEXT_PLUGIN_SKIP = "true"
  NPM_FLAGS = "--legacy-peer-deps"

# ---------------------------------------------------
# ROUTING & REWRITE RULES (Order Matters!)
# ---------------------------------------------------

# 1. Admin Control Center - Clean URL Routing
[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200
  force = true

[[redirects]]
  from = "/admin/"
  to = "/admin.html"
  status = 200
  force = true

[[redirects]]
  from = "/admin/*"
  to = "/admin.html"
  status = 200
  force = true

# 2. User Dashboard & Main Portal Aliases
[[redirects]]
  from = "/dashboard"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/portal"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/packages"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/campaign"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/wallet"
  to = "/index.html"
  status = 200

# 3. Default Fallback - Route all other paths to User Portal
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ---------------------------------------------------
# GLOBAL HTTP SECURITY & CACHE HEADERS
# ---------------------------------------------------

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=()"

# Admin Dashboard Security Headers (Prevent any external embedding)
[[headers]]
  for = "/admin*"
  [headers.values]
    X-Frame-Options = "DENY"
    Cache-Control = "no-cache, no-store, must-revalidate"

# Static Assets Caching
[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

